<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{name}}｜AI 開發工具速查</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<main class="wrap">
<p class="nav"><a href="../index.html">回到總表</a></p>

<!-- 1 標題區 -->
<h1>{{name}}</h1>
<div class="file">{{file}}</div>
<p class="lead">{{summary}}</p>

<!-- 2 怎麼載入 -->
<h2>怎麼載入</h2>
<ul>{{loads}}</ul>

<!-- 3 用在這個專案 -->
<h2>用在這個專案</h2>
<ul>{{use}}</ul>

<!-- 4 注意事項 -->
<h2>注意事項</h2>
{{notes}}

<!-- 5 官方連結與查證日期 -->
<footer>
<p>官方文件：<a href="{{link}}">{{link}}</a></p>
<p>查證日期：{{date}}</p>
</footer>
</main>
</body>
</html>
